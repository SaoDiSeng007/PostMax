<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PostMax</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f5f6fa;
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #3f4358;
    user-select: none;
  }
  .splash { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    box-shadow: 0 14px 30px -14px rgba(67, 56, 202, .7);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 34px; height: 34px; }
  .name { font-size: 17px; font-weight: 600; color: #22252f; letter-spacing: .3px; }
  .tip { font-size: 13px; color: #7a7f96; }
  .bar {
    width: 168px; height: 3px; border-radius: 2px; overflow: hidden;
    background: #e3e5ef; margin-top: 2px;
  }
  .bar::after {
    content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #6366f1, #818cf8);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .err {
    display: none;
    max-width: 560px; margin-top: 10px; padding: 14px 16px;
    background: #fff1f2; border: 1px solid #fecdd3; border-radius: 10px;
    color: #9f1239; font: 12px/1.75 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; user-select: text;
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <!-- 上箭头=请求发出，下箭头=响应返回，和后端 favicon 一致 -->
      <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 23H41" /><path d="M34.5 18.5 L41 23 L34.5 27.5" />
        <path d="M46 41H23" /><path d="M29.5 36.5 L23 41 L29.5 45.5" />
      </svg>
    </div>
    <div class="name">PostMax</div>
    <div class="tip" id="tip">正在启动本地服务…</div>
    <div class="bar" id="bar"></div>
    <pre class="err" id="err"></pre>
  </div>

  <script>
    // 外壳（Rust）调这个函数把失败原因写进页面。放在这里是因为它是页面自己的事：
    // 后端没起来时，用户唯一能看到的就是这张加载页。
    window.__postmaxError = function (message) {
      document.getElementById('tip').textContent = '启动失败';
      document.getElementById('bar').style.display = 'none';
      var box = document.getElementById('err');
      box.textContent = message;
      box.style.display = 'block';
    };
  </script>
</body>
</html>
